<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Daily progress report — step 1 (dark)</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#6AA8DB}a:hover{color:#9CC6EA}
</style>
</head>
<body>
<div dir="ltr" lang="en" style="width: 390px; height: 844px; box-sizing: border-box; background: #121519; font-family: Tajawal, system-ui, sans-serif; color: #ECEEF0; display: flex; flex-direction: column; overflow: hidden">
  <header style="background: #1B1F24; border-bottom: 1px solid #2E343C; padding: 10px 12px 14px; display: flex; flex-direction: column; gap: 12px">
    <div style="display: flex; align-items: center; gap: 4px">
      <a href="10-phone-today-en-dark.html" aria-label="Close" style="width: 44px; height: 44px; border-radius: 12px; color: #ECEEF0; display: flex; align-items: center; justify-content: center">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"></path></svg>
      </a>
      <div style="flex-grow: 1; display: flex; flex-direction: column">
        <span style="font-size: 17px; font-weight: 700">Daily progress report</span>
        <span style="font-size: 13px; color: #9AA4AF">Step 1 of 3 · Basics</span>
      </div>
      <span style="display: flex; align-items: center; gap: 6px; font-size: 13px; color: #63B67F; padding-inline-end: 6px">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 18a5 5 0 1 1 1-9.9A6 6 0 0 1 19 10a4 4 0 0 1 0 8z"></path><path d="m9 13 2 2 4-4"></path></svg>
        Draft saved
      </span>
    </div>
    <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; padding: 0 6px" aria-hidden="true">
      <div style="height: 5px; border-radius: 999px; background: #6AA8DB"></div>
      <div style="height: 5px; border-radius: 999px; background: #2E343C"></div>
      <div style="height: 5px; border-radius: 999px; background: #2E343C"></div>
    </div>
  </header>

  <main style="flex-grow: 1; overflow: hidden; padding: 20px; display: flex; flex-direction: column; gap: 22px">
    <fieldset style="border: 0; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px">
      <legend style="font-size: 15px; font-weight: 700; padding: 0; margin-bottom: 8px">Report date <span style="color: #E07B69">*</span></legend>
      <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
        <button type="button" aria-pressed="true" style="height: 48px; border-radius: 12px; border: 1.5px solid #6AA8DB; background: #1E2E3D; color: #CFE3F4; font-family: inherit; font-size: 16px; font-weight: 700">Today</button>
        <button type="button" aria-pressed="false" style="height: 48px; border-radius: 12px; border: 1.5px solid #2E343C; background: #1B1F24; color: #ECEEF0; font-family: inherit; font-size: 16px; font-weight: 500">Yesterday</button>
        <button type="button" style="height: 48px; border-radius: 12px; border: 1.5px solid #2E343C; background: #1B1F24; color: #ECEEF0; font-family: inherit; font-size: 16px; font-weight: 500">Other date</button>
      </div>
      <span style="font-size: 13px; color: #9AA4AF">Saturday 7 November 2026</span>
    </fieldset>

    <div style="display: flex; flex-direction: column; gap: 8px">
      <span style="font-size: 15px; font-weight: 700">Project <span style="color: #E07B69">*</span></span>
      <a href="11-phone-form-en-dark-validation-error.html" style="min-height: 56px; border-radius: 14px; background: #1B1F24; border: 1.5px solid #2E343C; padding: 0 14px; display: flex; align-items: center; gap: 12px; color: #ECEEF0; text-decoration: none">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#6AA8DB" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21s-7-6-7-11a7 7 0 0 1 14 0c0 5-7 11-7 11z"></path><circle cx="12" cy="10" r="2.5"></circle></svg>
        <span style="flex-grow: 1; display: flex; flex-direction: column">
          <span style="font-size: 17px; font-weight: 500">Demo project</span>
          <span style="font-size: 13px; color: #9AA4AF">DEMO-01 · your last choice</span>
        </span>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#9AA4AF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"></path></svg>
      </a>
    </div>

    <div style="display: flex; flex-direction: column; gap: 8px">
      <label for="crew-en" style="font-size: 15px; font-weight: 700">Workers present today <span style="color: #E07B69">*</span></label>
      <div style="display: flex; align-items: center; gap: 10px">
        <button type="button" aria-label="Decrease" style="width: 56px; height: 56px; border-radius: 14px; border: 1.5px solid #2E343C; background: #1B1F24; color: #ECEEF0; display: flex; align-items: center; justify-content: center">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M5 12h14"></path></svg>
        </button>
        <input id="crew-en" type="text" inputmode="numeric" value="2a" aria-invalid="true" aria-describedby="crew-err" style="flex-grow: 1; min-width: 0; height: 56px; border-radius: 14px; border: 1.5px solid #E07B69; background: #2A1C1A; text-align: center; font-family: inherit; font-size: 24px; font-weight: 700; color: #ECEEF0">
        <button type="button" aria-label="Increase" style="width: 56px; height: 56px; border-radius: 14px; border: 1.5px solid #2E343C; background: #1B1F24; color: #ECEEF0; display: flex; align-items: center; justify-content: center">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>
        </button>
      </div>
      <span id="crew-err" style="font-size: 14px; color: #E07B69; display: flex; align-items: center; gap: 6px">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M12 8v5M12 16h.01"></path></svg>
        Enter a whole number (digits only).
      </span>
    </div>

    <fieldset style="border: 0; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px">
      <legend style="font-size: 15px; font-weight: 700; padding: 0; margin-bottom: 8px">Weather <span style="color: #E07B69">*</span></legend>
      <div style="display: flex; flex-wrap: wrap; gap: 8px">
        <button type="button" aria-pressed="true" style="height: 46px; padding: 0 18px; border-radius: 999px; border: 1.5px solid #6AA8DB; background: #1E2E3D; color: #CFE3F4; font-family: inherit; font-size: 16px; font-weight: 700">Clear</button>
        <button type="button" aria-pressed="false" style="height: 46px; padding: 0 18px; border-radius: 999px; border: 1.5px solid #2E343C; background: #1B1F24; color: #ECEEF0; font-family: inherit; font-size: 16px; font-weight: 500">Rain</button>
        <button type="button" aria-pressed="false" style="height: 46px; padding: 0 18px; border-radius: 999px; border: 1.5px solid #2E343C; background: #1B1F24; color: #ECEEF0; font-family: inherit; font-size: 16px; font-weight: 500">Extreme heat</button>
        <button type="button" aria-pressed="false" style="height: 46px; padding: 0 18px; border-radius: 999px; border: 1.5px solid #2E343C; background: #1B1F24; color: #ECEEF0; font-family: inherit; font-size: 16px; font-weight: 500">Sandstorm</button>
        <button type="button" aria-pressed="false" style="height: 46px; padding: 0 18px; border-radius: 999px; border: 1.5px solid #2E343C; background: #1B1F24; color: #ECEEF0; font-family: inherit; font-size: 16px; font-weight: 500">Other</button>
      </div>
    </fieldset>
  </main>

  <footer style="background: #1B1F24; border-top: 1px solid #2E343C; padding: 12px 20px 22px">
    <a href="11-phone-form-en-dark-validation-error.html" style="height: 56px; border-radius: 16px; background: #6AA8DB; color: #08131F; font-size: 18px; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 8px; text-decoration: none">
      Next: progress
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 18 6-6-6-6"></path></svg>
    </a>
  </footer>
</div>
</body>
</html>
