<!doctype html>
<html lang="en">
<head>

<title>No connection — saved on the phone</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#6AA8DB}a:hover{color:#9CC6EA}
</style>
</head>
<body>
<div dir="ltr" lang="en" style="width: 390px; height: 844px; box-sizing: border-box; background: #121519; font-family: Tajawal, system-ui, sans-serif; color: #ECEEF0; display: flex; flex-direction: column; overflow: hidden">
  <div role="status" style="background: #3A2E1A; color: #F1C987; padding: 12px 20px; display: flex; align-items: center; gap: 10px; font-size: 14px; font-weight: 500">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 2l20 20M8.5 16.5a5 5 0 0 1 7 0M5 13a10 10 0 0 1 4.2-2.6M19 13a10 10 0 0 0-2.4-1.7M2 8.8a15 15 0 0 1 4.2-2.7M22 8.8A15 15 0 0 0 11 5.1M12 20h.01"></path></svg>
    No connection. You can keep working.
  </div>

  <div style="flex-grow: 1; padding: 24px 20px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; text-align: center">
    <div aria-hidden="true" style="width: 96px; height: 96px; border-radius: 999px; background: #3A2E1A; display: flex; align-items: center; justify-content: center">
      <div style="width: 64px; height: 64px; border-radius: 999px; background: #E0A94B; color: #1A1305; display: flex; align-items: center; justify-content: center">
        <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"></circle><path d="M12 7v5l3 2"></path></svg>
      </div>
    </div>
    <div style="display: flex; flex-direction: column; gap: 6px">
      <h1 style="margin: 0; font-size: 26px; font-weight: 800">Saved on this phone</h1>
      <p style="margin: 0; font-size: 16px; color: #9AA4AF; line-height: 1.55">Your report will be sent by itself when the connection comes back. Keep the app open or come back to it later — nothing is lost.</p>
    </div>

    <div style="width: 100%; background: #1B1F24; border: 1px solid #2E343C; border-radius: 18px; padding: 14px 16px; box-sizing: border-box; display: flex; flex-direction: column; gap: 12px; text-align: left">
      <span style="font-size: 13px; font-weight: 700; color: #9AA4AF">Waiting to send (1)</span>
      <div style="display: flex; align-items: center; gap: 12px">
        <div aria-hidden="true" style="width: 40px; height: 40px; border-radius: 12px; background: #1E2E3D; color: #6AA8DB; display: flex; align-items: center; justify-content: center; flex-shrink: 0">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="4" width="14" height="17" rx="2"></rect><path d="M9 4h6v3H9zM9 12h6M9 16h4"></path></svg>
        </div>
        <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 2px">
          <span style="font-size: 16px; font-weight: 700">Daily progress report</span>
          <span style="font-size: 14px; color: #9AA4AF">Demo project · 2 photos · 4:12 PM</span>
        </div>
      </div>
    </div>
  </div>

  <div style="padding: 0 20px 28px; display: flex; flex-direction: column; gap: 10px">
    <a href="10-phone-today-en-dark.html" style="height: 56px; border-radius: 16px; background: #6AA8DB; color: #08131F; font-size: 18px; font-weight: 700; display: flex; align-items: center; justify-content: center; text-decoration: none">Back to Today</a>
    <button type="button" style="height: 52px; border-radius: 16px; border: 1.5px solid #2E343C; background: #1B1F24; color: #ECEEF0; font-family: inherit; font-size: 17px; font-weight: 500">Try sending now</button>
  </div>
</div>
