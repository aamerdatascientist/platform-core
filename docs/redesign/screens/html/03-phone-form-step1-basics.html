<!doctype html>
<html lang="ar">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>تقرير التقدم اليومي — الخطوة 1</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#2E6A9E}a:hover{color:#1F4F78}
</style>
</head>
<body>
<div dir="rtl" lang="ar" style="width: 390px; height: 844px; box-sizing: border-box; background: #F3F5F7; font-family: Tajawal, system-ui, sans-serif; color: #13171C; display: flex; flex-direction: column; overflow: hidden">
  <header style="background: #FFFFFF; border-bottom: 1px solid #DEE2E7; padding: 10px 12px 14px; display: flex; flex-direction: column; gap: 12px">
    <div style="display: flex; align-items: center; gap: 4px">
      <a href="02-phone-today.html" aria-label="إغلاق" style="width: 44px; height: 44px; border-radius: 12px; color: #13171C; display: flex; align-items: center; justify-content: center">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"></path></svg>
      </a>
      <div style="flex-grow: 1; display: flex; flex-direction: column">
        <span style="font-size: 17px; font-weight: 700">تقرير التقدم اليومي</span>
        <span style="font-size: 13px; color: #5A6571">الخطوة 1 من 3 · الأساسيات</span>
      </div>
      <span style="display: flex; align-items: center; gap: 6px; font-size: 13px; color: #2B7449; padding-inline-end: 6px">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 18a5 5 0 1 1 1-9.9A6 6 0 0 1 19 10a4 4 0 0 1 0 8z"></path><path d="m9 13 2 2 4-4"></path></svg>
        حُفظت مسودة
      </span>
    </div>
    <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; padding: 0 6px" aria-hidden="true">
      <div style="height: 5px; border-radius: 999px; background: #2E6A9E"></div>
      <div style="height: 5px; border-radius: 999px; background: #DEE2E7"></div>
      <div style="height: 5px; border-radius: 999px; background: #DEE2E7"></div>
    </div>
  </header>

  <main style="flex-grow: 1; overflow: hidden; padding: 20px; display: flex; flex-direction: column; gap: 22px">
    <div style="display: flex; flex-direction: column; gap: 8px">
      <span style="font-size: 15px; font-weight: 700">المشروع <span style="color: #A8432F">*</span></span>
      <a href="04-phone-lookup-bottom-sheet.html" style="min-height: 56px; border-radius: 14px; background: #FFFFFF; border: 1.5px solid #DEE2E7; padding: 0 14px; display: flex; align-items: center; gap: 12px; color: #13171C; text-decoration: none">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#2E6A9E" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21s-7-6-7-11a7 7 0 0 1 14 0c0 5-7 11-7 11z"></path><circle cx="12" cy="10" r="2.5"></circle></svg>
        <span style="flex-grow: 1; display: flex; flex-direction: column">
          <span style="font-size: 17px; font-weight: 500">مشروع تجريبي</span>
          <span style="font-size: 13px; color: #5A6571">DEMO-01 · آخر ما اخترته</span>
        </span>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#5A6571" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"></path></svg>
      </a>
    </div>

    <fieldset style="border: 0; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px">
      <legend style="font-size: 15px; font-weight: 700; padding: 0; margin-bottom: 8px">تاريخ التقرير <span style="color: #A8432F">*</span></legend>
      <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
        <button type="button" aria-pressed="true" style="height: 48px; border-radius: 12px; border: 1.5px solid #2E6A9E; background: #E7F0F8; color: #1F4F78; font-family: inherit; font-size: 16px; font-weight: 700">اليوم</button>
        <button type="button" aria-pressed="false" style="height: 48px; border-radius: 12px; border: 1.5px solid #DEE2E7; background: #FFFFFF; color: #13171C; font-family: inherit; font-size: 16px; font-weight: 500">أمس</button>
        <button type="button" style="height: 48px; border-radius: 12px; border: 1.5px solid #DEE2E7; background: #FFFFFF; color: #13171C; font-family: inherit; font-size: 16px; font-weight: 500; display: flex; align-items: center; justify-content: center; gap: 6px">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"></rect><path d="M3 10h18M8 3v4M16 3v4"></path></svg>
          تاريخ آخر
        </button>
      </div>
      <span style="font-size: 13px; color: #5A6571">السبت 7 نوفمبر 2026</span>
    </fieldset>

    <div style="display: flex; flex-direction: column; gap: 8px">
      <label for="crew" style="font-size: 15px; font-weight: 700">عدد العمالة الحاضرة اليوم <span style="color: #A8432F">*</span></label>
      <div style="display: flex; align-items: center; gap: 10px">
        <button type="button" aria-label="زيادة" style="width: 56px; height: 56px; border-radius: 14px; border: 1.5px solid #DEE2E7; background: #FFFFFF; color: #13171C; display: flex; align-items: center; justify-content: center">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>
        </button>
        <input id="crew" type="text" inputmode="numeric" value="24" style="flex-grow: 1; min-width: 0; height: 56px; border-radius: 14px; border: 1.5px solid #DEE2E7; background: #FFFFFF; text-align: center; font-family: inherit; font-size: 24px; font-weight: 700; color: #13171C">
        <button type="button" aria-label="إنقاص" style="width: 56px; height: 56px; border-radius: 14px; border: 1.5px solid #DEE2E7; background: #FFFFFF; color: #13171C; display: flex; align-items: center; justify-content: center">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M5 12h14"></path></svg>
        </button>
      </div>
      <span style="font-size: 13px; color: #5A6571">أمس: 22 عاملاً</span>
    </div>

    <fieldset style="border: 0; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px">
      <legend style="font-size: 15px; font-weight: 700; padding: 0; margin-bottom: 8px">حالة الطقس <span style="color: #A8432F">*</span></legend>
      <div style="display: flex; flex-wrap: wrap; gap: 8px">
        <button type="button" aria-pressed="false" style="height: 46px; padding: 0 18px; border-radius: 999px; border: 1.5px solid #DEE2E7; background: #FFFFFF; color: #13171C; font-family: inherit; font-size: 16px; font-weight: 500">صافٍ</button>
        <button type="button" aria-pressed="true" style="height: 46px; padding: 0 18px; border-radius: 999px; border: 1.5px solid #2E6A9E; background: #E7F0F8; color: #1F4F78; font-family: inherit; font-size: 16px; font-weight: 700; display: flex; align-items: center; gap: 6px"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"></path></svg>حر شديد</button>
        <button type="button" aria-pressed="false" style="height: 46px; padding: 0 18px; border-radius: 999px; border: 1.5px solid #DEE2E7; background: #FFFFFF; color: #13171C; font-family: inherit; font-size: 16px; font-weight: 500">عاصفة رملية</button>
        <button type="button" aria-pressed="false" style="height: 46px; padding: 0 18px; border-radius: 999px; border: 1.5px solid #DEE2E7; background: #FFFFFF; color: #13171C; font-family: inherit; font-size: 16px; font-weight: 500">ممطر</button>
        <button type="button" aria-pressed="false" style="height: 46px; padding: 0 18px; border-radius: 999px; border: 1.5px solid #DEE2E7; background: #FFFFFF; color: #13171C; font-family: inherit; font-size: 16px; font-weight: 500">أخرى</button>
      </div>
    </fieldset>
  </main>

  <footer style="background: #FFFFFF; border-top: 1px solid #DEE2E7; padding: 12px 20px 22px">
    <a href="05-phone-form-step2-progress-conditional.html" style="height: 56px; border-radius: 16px; background: #2E6A9E; color: #FFFFFF; font-size: 18px; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 8px; text-decoration: none">
      التالي: التقدم
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg>
    </a>
  </footer>
</div>
</body>
</html>
