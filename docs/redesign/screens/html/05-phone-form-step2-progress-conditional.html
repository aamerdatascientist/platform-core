<!doctype html>
<html lang="ar">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>تقرير التقدم اليومي — الخطوة 2</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#2E6A9E}a:hover{color:#1F4F78}
</style>
</head>
<body>
<div dir="rtl" lang="ar" style="width: 390px; height: 844px; box-sizing: border-box; background: #F3F5F7; font-family: Tajawal, system-ui, sans-serif; color: #13171C; display: flex; flex-direction: column; overflow: hidden">
  <header style="background: #FFFFFF; border-bottom: 1px solid #DEE2E7; padding: 10px 12px 14px; display: flex; flex-direction: column; gap: 12px">
    <div style="display: flex; align-items: center; gap: 4px">
      <a href="03-phone-form-step1-basics.html" aria-label="رجوع" style="width: 44px; height: 44px; border-radius: 12px; color: #13171C; display: flex; align-items: center; justify-content: center">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"></path></svg>
      </a>
      <div style="flex-grow: 1; display: flex; flex-direction: column">
        <span style="font-size: 17px; font-weight: 700">تقرير التقدم اليومي</span>
        <span style="font-size: 13px; color: #5A6571">الخطوة 2 من 3 · التقدم</span>
      </div>
      <span style="display: flex; align-items: center; gap: 6px; font-size: 13px; color: #2B7449; padding-inline-end: 6px">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 18a5 5 0 1 1 1-9.9A6 6 0 0 1 19 10a4 4 0 0 1 0 8z"></path><path d="m9 13 2 2 4-4"></path></svg>
        حُفظت مسودة
      </span>
    </div>
    <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; padding: 0 6px" aria-hidden="true">
      <div style="height: 5px; border-radius: 999px; background: #2E6A9E"></div>
      <div style="height: 5px; border-radius: 999px; background: #2E6A9E"></div>
      <div style="height: 5px; border-radius: 999px; background: #DEE2E7"></div>
    </div>
  </header>

  <main style="flex-grow: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 22px">
    <fieldset style="border: 0; margin: 0; padding: 0">
      <legend style="font-size: 15px; font-weight: 700; padding: 0; margin-bottom: 10px">المرحلة <span style="color: #A8432F">*</span></legend>
      <div style="display: flex; flex-wrap: wrap; gap: 8px">
        
          <button type="button" aria-pressed="false" style="height: 46px; padding: 0 16px; border-radius: 999px; border: 1.5px solid #DEE2E7; background: #FFFFFF; color: #13171C; font-family: inherit; font-size: 16px; font-weight: 500; cursor: pointer">الأعمال الورقية</button>
        
          <button type="button" aria-pressed="false" style="height: 46px; padding: 0 16px; border-radius: 999px; border: 1.5px solid #DEE2E7; background: #FFFFFF; color: #13171C; font-family: inherit; font-size: 16px; font-weight: 500; cursor: pointer">الحفر</button>
        
          <button type="button" aria-pressed="true" style="height: 46px; padding: 0 16px; border-radius: 999px; border: 1.5px solid #2E6A9E; background: #E7F0F8; color: #1F4F78; font-family: inherit; font-size: 16px; font-weight: 700; cursor: pointer">الأساسات</button>
        
          <button type="button" aria-pressed="false" style="height: 46px; padding: 0 16px; border-radius: 999px; border: 1.5px solid #DEE2E7; background: #FFFFFF; color: #13171C; font-family: inherit; font-size: 16px; font-weight: 500; cursor: pointer">الهيكل الإنشائي</button>
        
          <button type="button" aria-pressed="false" style="height: 46px; padding: 0 16px; border-radius: 999px; border: 1.5px solid #DEE2E7; background: #FFFFFF; color: #13171C; font-family: inherit; font-size: 16px; font-weight: 500; cursor: pointer">الأعمال الكهروميكانيكية</button>
        
      </div>
    </fieldset>

    <div style="display: flex; flex-direction: column; gap: 8px; background: #FFFFFF; border: 1px solid #DEE2E7; border-radius: 16px; padding: 14px">
      <span style="align-self: flex-start; font-size: 12px; font-weight: 700; color: #1F4F78; background: #E7F0F8; border-radius: 999px; padding: 4px 10px">يظهر لأنك اخترت: الأساسات</span>
      <span style="font-size: 15px; font-weight: 700">القاعدة <span style="color: #A8432F">*</span></span>
      <a href="04-phone-lookup-bottom-sheet.html" style="min-height: 52px; border-radius: 12px; background: #F3F5F7; border: 1.5px solid #DEE2E7; padding: 0 14px; display: flex; align-items: center; justify-content: space-between; color: #13171C; text-decoration: none">
        <span style="font-size: 17px; font-weight: 500">القاعدة F-03</span>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#5A6571" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"></path></svg>
      </a>
      <span style="font-size: 13px; color: #5A6571">قواعد مشروع تجريبي فقط</span>
    </div>

    <fieldset style="border: 0; margin: 0; padding: 0">
      <legend style="font-size: 15px; font-weight: 700; padding: 0; margin-bottom: 10px">هل تم إنجاز كل العمل المخطط له اليوم؟ <span style="color: #A8432F">*</span></legend>
      <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
        <button type="button" aria-pressed="false" style="height: 52px; border-radius: 14px; border: 1.5px solid #DEE2E7; background: #FFFFFF; color: #13171C; font-family: inherit; font-size: 17px; font-weight: 500; cursor: pointer">نعم</button>
        <button type="button" aria-pressed="true" style="height: 52px; border-radius: 14px; border: 1.5px solid #2E6A9E; background: #E7F0F8; color: #1F4F78; font-family: inherit; font-size: 17px; font-weight: 700; cursor: pointer">لا</button>
      </div>
    </fieldset>

    <fieldset style="border: 0; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px">
      <legend style="font-size: 15px; font-weight: 700; padding: 0; margin-bottom: 10px">هل حدث تأخير أو تعطيل اليوم؟ <span style="color: #A8432F">*</span></legend>
      <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
        <button type="button" aria-pressed="true" style="height: 52px; border-radius: 14px; border: 1.5px solid #2E6A9E; background: #E7F0F8; color: #1F4F78; font-family: inherit; font-size: 17px; font-weight: 700; cursor: pointer">نعم</button>
        <button type="button" aria-pressed="false" style="height: 52px; border-radius: 14px; border: 1.5px solid #DEE2E7; background: #FFFFFF; color: #13171C; font-family: inherit; font-size: 17px; font-weight: 500; cursor: pointer">لا</button>
      </div>
      
        <div style="display: flex; flex-direction: column; gap: 8px; border-inline-start: 3px solid #2E6A9E; padding-inline-start: 12px; margin-top: 4px">
          <label for="cause" style="font-size: 15px; font-weight: 700">سبب التأخير <span style="color: #A8432F">*</span></label>
          <textarea id="cause" rows="3" placeholder="مثال: تأخر وصول الخرسانة الجاهزة ساعتين" style="border-radius: 14px; border: 1.5px solid #DEE2E7; background: #FFFFFF; padding: 12px 14px; font-family: inherit; font-size: 16px; color: #13171C; resize: none"></textarea>
        </div>
      
    </fieldset>

    <fieldset style="border: 0; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px">
      <legend style="font-size: 15px; font-weight: 700; padding: 0; margin-bottom: 10px">هل توجد أي مشاكل اليوم؟ <span style="color: #A8432F">*</span></legend>
      <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
        <button type="button" aria-pressed="false" style="height: 52px; border-radius: 14px; border: 1.5px solid #DEE2E7; background: #FFFFFF; color: #13171C; font-family: inherit; font-size: 17px; font-weight: 500; cursor: pointer">نعم</button>
        <button type="button" aria-pressed="true" style="height: 52px; border-radius: 14px; border: 1.5px solid #2E6A9E; background: #E7F0F8; color: #1F4F78; font-family: inherit; font-size: 17px; font-weight: 700; cursor: pointer">لا</button>
      </div>
      
    </fieldset>
  </main>

  <footer style="background: #FFFFFF; border-top: 1px solid #DEE2E7; padding: 12px 20px 22px; display: flex; gap: 10px">
    <a href="03-phone-form-step1-basics.html" style="width: 96px; height: 56px; border-radius: 16px; border: 1.5px solid #DEE2E7; color: #13171C; font-size: 17px; font-weight: 500; display: flex; align-items: center; justify-content: center; text-decoration: none">السابق</a>
    <a href="06-phone-form-step3-photos-review.html" style="flex-grow: 1; height: 56px; border-radius: 16px; background: #2E6A9E; color: #FFFFFF; font-size: 18px; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 8px; text-decoration: none">
      التالي: الصور
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg>
    </a>
  </footer>
</div>
</body>
</html>
