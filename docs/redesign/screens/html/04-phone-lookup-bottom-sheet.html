</style>

<div dir="rtl" lang="ar" style="width: 390px; height: 844px; box-sizing: border-box; background: #F3F5F7; font-family: Tajawal, system-ui, sans-serif; color: #13171C; position: relative; overflow: hidden">
  <div aria-hidden="true" style="background: #FFFFFF; border-bottom: 1px solid #DEE2E7; padding: 18px 20px; display: flex; flex-direction: column; gap: 4px">

      <a href="03-phone-form-step1-basics.html" aria-label="إغلاق" style="width: 44px; height: 44px; border-radius: 999px; color: #13171C; display: flex; align-items: center; justify-content: center">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"></path></svg>

      </div>
    </div>

    <div style="flex-grow: 1; overflow: hidden; padding: 0 12px">
      <div style="font-size: 13px; font-weight: 700; color: #5A6571; padding: 8px 8px">مؤخراً</div>
      <a href="03-phone-form-step1-basics.html" style="min-height: 64px; border-radius: 14px; background: #E7F0F8; padding: 0 12px; display: flex; align-items: center; gap: 12px; color: #13171C; text-decoration: none">
        <span style="flex-grow: 1; display: flex; flex-direction: column; gap: 2px">

          <span style="font-size: 13px; color: #5A6571">DEMO-01 · نشط</span>
        </span>
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#2E6A9E" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"></path></svg>

          <span style="flex-grow: 1; display: flex; flex-direction: column; gap: 2px">
            <span style="font-size: 17px; font-weight: 500">مشروع (مثال) ب</span>
            <span style="font-size: 13px; color: #5A6571">P-002 · نشط</span>
          </span>
        </a>

          <span style="flex-grow: 1; display: flex; flex-direction: column; gap: 2px">

            <span style="font-size: 13px; color: #5A6571">P-003 · متوقف مؤقتاً</span>
          </span>

        <a href="03-phone-form-step1-basics.html" style="min-height: 64px; padding: 0 12px; display: flex; align-items: center; gap: 12px; color: #13171C; text-decoration: none; border-bottom: 1px solid #EEF0F3">

            <span style="font-size: 17px; font-weight: 500">مشروع (مثال) د</span>
            <span style="font-size: 13px; color: #5A6571">P-004 · التخطيط</span>
          </span>
