<!doctype html>
<html lang="ar">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>أساس — تسجيل الدخول</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#2E6A9E}a:hover{color:#1F4F78}
</style>
</head>
<body>
<div dir="rtl" lang="ar" style="width: 390px; height: 844px; box-sizing: border-box; background: #F3F5F7; font-family: Tajawal, system-ui, sans-serif; color: #13171C; display: flex; flex-direction: column; padding: 20px 24px 32px; position: relative; overflow: hidden">
  <div style="display: flex; justify-content: space-between; align-items: center">
    <button type="button" style="height: 44px; padding: 0 16px; border-radius: 999px; border: 1px solid #DEE2E7; background: #FFFFFF; font-family: inherit; font-size: 15px; font-weight: 500; color: #13171C; display: flex; align-items: center; gap: 8px">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"></path></svg>
      English
    </button>
    <button type="button" aria-label="الوضع الداكن" style="width: 44px; height: 44px; border-radius: 999px; border: 1px solid #DEE2E7; background: #FFFFFF; color: #13171C; display: flex; align-items: center; justify-content: center">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"></path></svg>
    </button>
  </div>

  <div style="flex-grow: 1; display: flex; flex-direction: column; justify-content: center; gap: 36px">
    <div style="display: flex; flex-direction: column; align-items: center; gap: 14px">
      <div aria-hidden="true" style="width: 72px; height: 72px; border-radius: 20px; background: #FFFFFF; border: 1px solid #DEE2E7; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px">
        <div style="width: 34px; height: 8px; border-radius: 3px; background: #7FA9D6; transform: skewX(-18deg)"></div>
        <div style="width: 34px; height: 8px; border-radius: 3px; background: #4C82BC; transform: skewX(-18deg)"></div>
        <div style="width: 34px; height: 8px; border-radius: 3px; background: #2E6A9E; transform: skewX(-18deg)"></div>
      </div>
      <div style="display: flex; flex-direction: column; align-items: center; gap: 4px">
        <h1 style="margin: 0; font-size: 30px; font-weight: 800; letter-spacing: 0">أساس</h1>
        <p style="margin: 0; font-size: 16px; color: #5A6571">سجّل الدخول للمتابعة</p>
      </div>
    </div>

    <form style="display: flex; flex-direction: column; gap: 18px; margin: 0">
      <div style="display: flex; flex-direction: column; gap: 8px">
        <label for="email" style="font-size: 15px; font-weight: 500">البريد الإلكتروني</label>
        <input id="email" type="email" dir="ltr" value="hazem@company.sa" style="height: 54px; border-radius: 14px; border: 1.5px solid #2E6A9E; background: #FFFFFF; padding: 0 16px; font-family: inherit; font-size: 17px; color: #13171C; text-align: right; box-shadow: 0 0 0 4px #E7F0F8; outline: none">
      </div>
      <div style="display: flex; flex-direction: column; gap: 8px">
        <label for="pw" style="font-size: 15px; font-weight: 500">كلمة المرور</label>
        <div style="position: relative">
          <input id="pw" type="password" value="password12" style="width: 100%; box-sizing: border-box; height: 54px; border-radius: 14px; border: 1.5px solid #DEE2E7; background: #FFFFFF; padding: 0 16px 0 56px; font-family: inherit; font-size: 17px; color: #13171C">
          <button type="button" aria-label="إظهار كلمة المرور" style="position: absolute; left: 6px; top: 5px; width: 44px; height: 44px; border: 0; background: transparent; color: #5A6571; display: flex; align-items: center; justify-content: center">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z"></path><circle cx="12" cy="12" r="3"></circle></svg>
          </button>
        </div>
      </div>
      <p style="margin: 0; font-size: 14px; color: #5A6571; line-height: 1.6">نسيت كلمة المرور؟ يعيد المسؤول تعيينها لك من صفحة المستخدمين.</p>
    </form>
  </div>

  <a href="02-phone-today.html" style="height: 56px; border-radius: 16px; background: #2E6A9E; color: #FFFFFF; font-size: 18px; font-weight: 700; display: flex; align-items: center; justify-content: center; text-decoration: none">تسجيل الدخول</a>
</div>
</body>
</html>
