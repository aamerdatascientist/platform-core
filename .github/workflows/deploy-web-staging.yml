name: Build and deploy frontend to Azure Static Web App - staging

# Staging copy of azure-static-web-apps-black-field-04a8cb300.yml. Builds with
# `--mode staging`, so Vite reads platform-web/.env.staging (the staging API) instead of
# .env.production. No pull-request previews: those would talk to the production API.
on:
  push:
    branches:
      - staging
  workflow_dispatch:

jobs:
  build_and_deploy_job:
    runs-on: ubuntu-latest
    name: Build and Deploy Job
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          lfs: false
      - name: Build And Deploy
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_STAGING }}
          action: "upload"
          app_location: "./platform-web"
          api_location: ""
          output_location: "dist"
          app_build_command: "npm run build -- --mode staging"
