<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <title>Asas</title>
    <script>
      // Set dir/lang before React mounts, from the same localStorage key i18n/index.ts
      // uses - avoids a flash of the wrong direction on load for a returning Arabic user.
      (function () {
        var lang = localStorage.getItem('lang') || 'en';
        document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';
        document.documentElement.lang = lang;
      })();
      // Set data-mode before React mounts, same reasoning and same localStorage-key
      // pattern as the dir/lang IIFE above (see src/theme/mode.ts) - avoids a flash of
      // the wrong mode on load for a returning user. Defaults to dark - "Structural
      // steel" is a dark-first industrial direction; light is the deliberate companion
      // palette, not the default.
      (function () {
        var mode = localStorage.getItem('mode') || 'dark';
        document.documentElement.setAttribute('data-mode', mode);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
